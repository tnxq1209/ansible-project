---
# tasks file for roles/nginx
- name: Install Nginx 
  dnf: 
    name: "{{ nginx_package }}"
    state: present 
    update_cache: true

- name: ensure nginx service is running
  service:
    name: "{{ nginx_service }}"
    state: started 
    enabled: true

- name: Deploy config 
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/default.conf
  notify: Restart Nginx
